[package]
name = "slopchat"
version = "0.1.0"
description = "Keyboard-first lightweight chat client"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.84"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
notify = "8"
keyring = "4"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
glib = "0.18"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
png = "0.18"

[lints.clippy]
too_many_arguments = "deny"
new_without_default = "deny"
dbg_macro = "deny"
todo = "deny"

[lints.rust]
unused_must_use = "deny"
